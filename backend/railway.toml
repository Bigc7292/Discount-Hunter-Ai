# Railway service config for the Express + Puppeteer verifier.
# In Railway dashboard: set Root Directory to `backend` (or deploy this folder).
# Prefer Dockerfile so Chromium system deps are installed correctly.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
