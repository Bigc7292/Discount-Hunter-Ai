# Discount Hunter verifier API — Fly.io
# Deploy from backend/: fly deploy
# App name must match `fly apps create` / dashboard.

app = "discount-hunter-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  # Fly injects PORT; app uses process.env.PORT || 3001
  # Chromium paths are set in Dockerfile

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
